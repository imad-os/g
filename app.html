<!-- Launcher markup. Injected into <body> by js/boot/loader.js (bundled package or hosted copy). -->
<div id="stage" class="stage">

    <!-- Desktop: wallpaper, icons, taskbar and Start menu (js/launcher/desktop.js) -->
    <main id="desktop" class="desktop" aria-labelledby="desk-title">
        <div id="wallpaper" class="wp"></div>
        <h1 id="desk-title" class="sr-only" data-i18n="appTitle">My PC</h1>
        <div id="desk-icons" class="desk-icons" role="list"></div>

        <div id="start" class="start" role="dialog" aria-modal="true" aria-labelledby="start-title" hidden>
            <h2 id="start-title" class="start-h" data-i18n="pinned">Pinned</h2>
            <div id="start-pinned" class="start-grid" role="list"></div>
            <h2 class="start-h" data-i18n="recommended">Recommended</h2>
            <div id="start-recent" class="start-recent"></div>
            <div class="start-foot">
                <button id="btn-profile" class="start-user" data-focus><span id="profile-avatar" class="avatar" aria-hidden="true"></span><span id="profile-name"></span></button>
                <button id="btn-power" class="start-power" data-focus data-i18n-aria-label="power"></button>
            </div>
        </div>

        <footer id="taskbar" class="taskbar">
            <div id="tb-apps" class="tb-apps"></div>
            <div class="tray">
                <span id="input-indicator" class="tray-ic" role="status"></span>
                <span id="tray-net" class="tray-ic" aria-hidden="true"></span>
                <span id="tray-vol" class="tray-ic" aria-hidden="true"></span>
                <button id="tray-clock" class="tray-clock" data-focus><span id="tray-time"></span><span id="tray-date"></span></button>
                <span id="app-version" class="tray-ver"></span>
            </div>
        </footer>
    </main>

    <!-- One app at a time, full screen; its content is destroyed when it closes (js/launcher/window.js) -->
    <section id="window" class="window" role="dialog" aria-modal="true" aria-labelledby="win-title" data-scroll="y" hidden>
        <div class="win-bar">
            <span id="win-icon" class="win-icon" aria-hidden="true"></span>
            <h2 id="win-title" class="win-title"></h2>
            <button id="win-close" class="win-close" data-focus data-i18n-aria-label="close"></button>
        </div>
        <div id="win-body" class="win-body"></div>
    </section>

    <!-- Player profiles: switch, create, rename, delete -->
    <section id="profiles" class="screen profiles" role="dialog" aria-modal="true" aria-labelledby="profiles-title" hidden>
        <h2 id="profiles-title" class="screen-title" data-i18n="profiles">Profiles</h2>
        <p class="profiles-hint" data-i18n="profilesHint"></p>
        <div id="profiles-list" class="profiles-list" role="list"></div>
        <div class="profiles-buttons">
            <button id="profile-new" class="btn btn-primary" data-focus data-i18n="newProfile">New profile</button>
            <button id="profile-rename" class="btn" data-focus data-i18n="renameProfile">Rename</button>
            <button id="profile-delete" class="btn" data-focus data-i18n="deleteProfile">Delete</button>
            <button id="profiles-close" class="btn" data-focus data-i18n="close">Close</button>
        </div>
    </section>

    <!-- On-screen keyboard (works with the remote; a PC keyboard can type too) -->
    <div id="namer" class="backdrop namer" hidden>
        <div class="dialog namer-box" role="dialog" aria-modal="true" aria-labelledby="namer-title">
            <h2 id="namer-title" class="dialog-title"></h2>
            <div id="namer-text" class="namer-text" aria-live="polite"></div>
            <div id="namer-keys" class="namer-keys"></div>
        </div>
    </div>

    <!-- Game layer: one game at a time, in an iframe created by js/launcher/game-host.js -->
    <section id="game-layer" class="game-layer" tabindex="-1" hidden>
        <div id="game-frame-box" class="game-frame-box"></div>

        <div id="game-loading" class="game-loading" hidden>
            <div id="game-loading-title" class="loading-title"></div>
            <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-aria-label="loading">
                <div id="game-loading-fill" class="bar-fill"></div>
            </div>
        </div>

        <div id="game-error" class="dialog" role="dialog" aria-modal="true" aria-labelledby="game-error-text" hidden>
            <p id="game-error-text" class="dialog-text" data-i18n="loadError">The game could not be loaded.</p>
            <div class="dialog-buttons">
                <button id="game-error-retry" class="btn btn-primary" data-focus data-i18n="retry">Retry</button>
                <button id="game-error-back" class="btn" data-focus data-i18n="backToMenu">Back to menu</button>
            </div>
        </div>

        <!-- Arcade-style initials entry when a game ends with a top-10 score -->
        <div id="entry" class="pause" role="dialog" aria-modal="true" aria-labelledby="entry-title" aria-describedby="entry-score" hidden>
            <div class="pause-box entry-box">
                <h2 id="entry-title" class="pause-title"></h2>
                <p id="entry-score" class="entry-score"></p>
                <div id="entry-letters" class="entry-letters"></div>
                <p class="entry-hint" data-i18n="entryHint"></p>
                <button id="entry-ok" class="btn btn-primary" data-focus data-i18n="save">Save</button>
            </div>
        </div>

        <div id="pause" class="pause" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
            <div class="pause-box">
                <h2 id="pause-title" class="pause-title" data-i18n="paused">Paused</h2>
                <div id="pause-items" class="pause-items"></div>
            </div>
        </div>
    </section>

    <!-- Generic confirmation dialog (exit, reset progress) -->
    <div id="dialog-backdrop" class="backdrop" hidden>
        <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-text">
            <h2 id="dialog-title" class="dialog-title"></h2>
            <p id="dialog-text" class="dialog-text"></p>
            <div class="dialog-buttons">
                <button id="dialog-yes" class="btn btn-primary" data-focus></button>
                <button id="dialog-no" class="btn" data-focus></button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <!-- Network status popup (Samsung checklist: a disconnection must be notified to the user) -->
    <div id="netpop" class="netpop" role="alert" hidden><span class="netpop-icon" aria-hidden="true"></span><span id="netpop-text"></span></div>
    <div id="a11y-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</div>
