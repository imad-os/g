<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Jumper</title>
<link rel="stylesheet" href="../shared/game.css">
<style>
  .map-info { position: absolute; left: 0; top: 150px; width: 1920px; text-align: center; pointer-events: none;
              text-shadow: 0 4px 0 #000, 4px 0 0 #000, -4px 0 0 #000, 0 -4px 0 #000; }
  .map-title { font-size: 64px; font-weight: 900; color: #ffd23f; }
  .map-stage { font-size: 48px; font-weight: 800; margin-top: 12px; }
  .map-stars { font-size: 48px; color: #ffd23f; margin-top: 8px; }
  .map-help { position: absolute; left: 0; top: 820px; width: 1920px; font-size: 30px; font-weight: 600; }
  .hc .map-info { text-shadow: none; }
  .hc .map-info div { background: #000; display: inline-block; padding: 4px 18px; }
</style>
</head>
<body class="pixel">
<canvas id="game" aria-hidden="true"></canvas>
<div id="hud" class="hud" aria-hidden="true"></div>
<div id="mapinfo" class="map-info" aria-hidden="true" hidden></div>
<div id="banner" class="banner" aria-hidden="true" hidden></div>
<script src="../shared/gamekit.js"></script>
<script src="js/art.js"></script>
<script src="js/music.js"></script>
<script src="js/level.js"></script>
<script src="js/actors.js"></script>
<script src="js/game.js"></script>
</body>
</html>
