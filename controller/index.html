<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101226">
<title>My PC controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#101226;color:#fff;font:16px/1.3 system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.screen[hidden]{display:none}
h1{margin:0;font-size:22px}
p{margin:0;opacity:.75;text-align:center;max-width:420px}
input{font:700 28px/1 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;text-align:center;width:min(86vw,320px);padding:12px;border-radius:12px;border:2px solid #3a3f8f;background:#1b1e3f;color:#fff;touch-action:auto;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:12px}
button{font:700 18px/1 system-ui,sans-serif;color:#fff;background:#2b2f7a;border:2px solid #4a50b8;border-radius:14px;padding:14px 22px;min-width:96px}
button.on,button.go{background:#5b63ff;border-color:#9aa0ff}
#err{color:#ff9a9a;min-height:1.3em}
/* pad: landscape only */
#pad{position:fixed;inset:0;display:none}
#pad.show{display:block}
#bar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;font-weight:700}
#dot{width:10px;height:10px;border-radius:50%;background:#e55}
#dot.ok{background:#4d4}
#badge{padding:4px 12px;border-radius:999px;background:#5b63ff}
.z{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
#dpad{left:calc(4vw + env(safe-area-inset-left));top:50%;width:min(44vh,34vw);height:min(44vh,34vw);transform:translateY(-45%)}
.d{position:absolute;width:34%;height:34%;background:#2b2f7a;border:2px solid #4a50b8;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.d.on,.b.on,.m.on{background:#5b63ff;border-color:#c0c4ff}
#d-up{left:33%;top:0}#d-down{left:33%;bottom:0}#d-left{left:0;top:33%}#d-right{right:0;top:33%}
.b{position:absolute;width:min(22vh,18vw);height:min(22vh,18vw);border-radius:50%;background:#2b2f7a;border:2px solid #4a50b8;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
#b-ok{right:calc(4vw + env(safe-area-inset-right));top:48%}
#b-run{right:calc(4vw + min(24vh,20vw) + env(safe-area-inset-right));top:62%}
#b-cancel{right:calc(4vw + min(12vh,10vw) + env(safe-area-inset-right));top:22%}
.m{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));padding:10px 16px;min-width:0;font-size:15px;border-radius:999px;background:#2b2f7a;border:2px solid #4a50b8}
#m-menu{left:calc(50% - 90px)}#m-pause{left:calc(50% + 10px)}
#leave{position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));min-width:0;padding:6px 12px;font-size:14px;background:transparent;border-color:#3a3f8f}
#turn{position:fixed;inset:0;z-index:9;background:#101226;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:700}
@media (orientation:portrait){body.playing #turn{display:flex}}
</style>
</head>
<body>
<section id="join" class="screen">
    <h1 id="t-title">Phone controller</h1>
    <p id="t-help"></p>
    <input id="code" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code">
    <div class="row"><button id="p1" class="on">P1</button><button id="p2">P2</button></div>
    <button id="go" class="go"></button>
    <div id="err" role="alert"></div>
</section>
<section id="pad" aria-label="Controller">
    <div id="bar"><span id="dot"></span><span id="badge">P1</span><span id="state"></span></div>
    <button id="leave"></button>
    <div id="dpad" class="z">
        <div class="d" id="d-up" data-a="up">▲</div><div class="d" id="d-left" data-a="left">◀</div>
        <div class="d" id="d-right" data-a="right">▶</div><div class="d" id="d-down" data-a="down">▼</div>
    </div>
    <div class="b" id="b-cancel" data-a="cancel">C</div>
    <div class="b" id="b-run" data-a="run">B</div>
    <div class="b" id="b-ok" data-a="ok">A</div>
    <button class="m" id="m-menu" data-a="menu">☰</button>
    <button class="m" id="m-pause" data-a="pause">⏸</button>
</section>
<div id="turn"></div>
<script src="../js/core/storage.js"></script>
<script src="../js/core/cloud.js"></script>
<script src="../js/core/rooms.js"></script>
<script src="../js/core/netlink.js"></script>
<script src="controller.js"></script>
</body>
</html>
